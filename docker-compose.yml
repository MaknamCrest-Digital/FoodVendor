services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: foodvendor
      POSTGRES_USER: foodvendor
      POSTGRES_PASSWORD: localdev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./services/api:/app"]
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://foodvendor:localdev@db:5432/foodvendor
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL for the API service}
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
