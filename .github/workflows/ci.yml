name: CI
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/api}}
    # Throwaway PostgreSQL for Alembic checks. The credentials exist only inside this
    # job's container; CI never connects to Supabase or any shared database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maknam_ci
          POSTGRES_PASSWORD: maknam_ci_throwaway
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U maknam_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - name: Alembic migrations on PostgreSQL (fresh, and 0004 with data → head)
        run: python scripts/verify_migrations.py
        env:
          MIGRATION_CHECK_URL: postgresql+psycopg://maknam_ci:maknam_ci_throwaway@localhost:5432/postgres
  pos:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/pos}}
    # The PWA refuses to start without Supabase settings. These test-only values are
    # never contacted: E2E specs mock Supabase Auth and the API.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: food-vendor-os-1.0.0-${{ github.sha }}
          path: apps/pos/out/
  fullstack:
    # Real FastAPI + seeded pilot tenant (isolated SQLite, local JWKS) + built PWA.
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r services/api/requirements.txt
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: apps/pos
      - run: |
          python services/api/scripts/e2e_server.py /tmp/maknam-e2e 8020 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8020/health/db && break; sleep 1; done
      - run: npx playwright test e2e/fullstack.spec.ts
        working-directory: apps/pos
        env: {FULLSTACK_TOKENS: /tmp/maknam-e2e/tokens.json}
